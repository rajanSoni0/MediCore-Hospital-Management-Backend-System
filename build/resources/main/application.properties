# =============================================
# Application
# =============================================
spring.application.name=hospital-management-system
server.port=8080

# =============================================
# MySQL DataSource
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# Log4j2 (config file in resources)
# =============================================
logging.config=classpath:log4j2.xml

# =============================================
# JWT Configuration
# =============================================
# Use a strong 256-bit Base64-encoded secret in production (never commit the real one)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000
# 86400000 ms = 24 hours


webhook.appointment.url=https://your-external-service.com/webhook/appointment
webhook.enabled=true
webhook.timeout-ms=5000

